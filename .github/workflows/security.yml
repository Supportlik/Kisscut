name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 06:17 UTC — new advisories are found without a push happening.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Audits exactly what a user installs: the locked runtime dependency set
      # including every extra, resolved from uv.lock rather than from a range.
      - name: Export the locked runtime dependencies
        run: uv export --format requirements-txt --all-extras --no-dev --no-emit-project -o requirements.txt

      - name: Audit against the PyPI advisory database
        run: uvx pip-audit --strict --requirement requirements.txt

  trivy:
    name: Repository scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Scan for vulnerabilities, secrets and misconfigurations
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --format sarif --output trivy.sarif --exit-code 0 --no-progress .

      - name: Upload the results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Second pass over the cached database: fails the build on anything
      # actionable, so a HIGH finding blocks a merge instead of only filing an alert.
      - name: Fail on HIGH or CRITICAL findings
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-db-update --skip-check-update --no-progress .

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
