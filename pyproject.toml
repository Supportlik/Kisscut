[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kisscut"
dynamic = ["version"]
description = "Photo to WhatsApp sticker: cut out the subject, cut it to shape, give it a border - in the browser or from the command line"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Bortlik", email = "michael@bortlik.io" }]
keywords = ["sticker", "whatsapp", "cutout", "background-removal", "webp", "image"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
]
# The web interface is standard library only; these four do the image work.
# rembg carries the segmentation models and onnxruntime.
# Python 3.11 is the floor because onnxruntime, which rembg pulls in for the
# cutout models, stopped shipping wheels for 3.10.
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "rembg[cpu]>=2.0.60",
]

[project.scripts]
kisscut = "kisscut.cli:main"

[project.urls]
Homepage = "https://github.com/Supportlik/Kisscut"
Repository = "https://github.com/Supportlik/Kisscut"
Issues = "https://github.com/Supportlik/Kisscut/issues"
Changelog = "https://github.com/Supportlik/Kisscut/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8"]

# The version lives in src/kisscut/__init__.py only, so --version and the
# package metadata cannot drift apart.
[tool.hatch.version]
path = "src/kisscut/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kisscut"]

# The sample images are committed so the repo can be tried without running the
# generator, but they are dead weight in an sdist - the generator stays in.
[tool.hatch.build.targets.sdist]
exclude = ["examples/*.jpg", "examples/*.png", "docs/*.png", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the rembg model files (downloads on first run)"]
